<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Release Watcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:         #121212;
      --bg-card:    #1e1e1e;
      --bg-hover:   #2a2a2a;
      --text:       #e8e4db;
      --text-muted: #888;
      --accent:     #d4af37;
      --accent-dim: #b8941e;
      --border:     #2e2e2e;
      --green:      #4ade80;
      --red:        #f87171;
      --yellow:     #facc15;
      --blue:       #60a5fa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font: 700 1.5rem/1 Georgia, serif;
      letter-spacing: 0.06em;
      color: var(--accent);
    }

    /* ── Buttons ── */
    button, .add-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-dim); }
    button:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Main ── */
    main {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1rem;
      flex: 1;
    }

    /* ── Search ── */
    .search-section { margin-bottom: 2.5rem; position: relative; }
    .search-container { display: flex; gap: 0.75rem; }
    input[type="text"] {
      flex: 1;
      padding: 0.65rem 0.85rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }

    select {
      padding: 0.65rem 0.85rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.875rem;
      cursor: pointer;
    }

    .search-results {
      position: absolute;
      left: 0; right: 0; top: 100%;
      z-index: 10;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 320px;
      overflow-y: auto;
      display: none;
      margin-top: 0.5rem;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .search-results.visible { display: block; }

    .search-result-item {
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      transition: background 0.12s;
    }
    .search-result-item:hover { background: var(--bg-hover); }
    .search-result-item:last-child { border-bottom: none; }

    .result-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .result-type {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      margin-right: 0.5rem;
      vertical-align: middle;
    }
    .result-type { background: var(--border); color: var(--text-muted); }

    /* ── Calendar ── */
    .calendar-section { margin-bottom: 2rem; }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .calendar-header h2 { font-size: 1.25rem; font-weight: 600; }
    .calendar-nav { display: flex; gap: 0.5rem; }
    .calendar-nav button { padding: 0.4rem 1rem; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: var(--bg-card);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .calendar-weekday {
      text-align: center;
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 0.4rem 0;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .calendar-day {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.35rem;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: var(--bg);
    }
    .calendar-day.other-month {
      background: transparent;
      opacity: .25;
    }
    .calendar-day.today {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .calendar-day-number {
      font-weight: 700;
      font-size: 0.75rem;
      margin-bottom: 2px;
      color: var(--text-muted);
    }
    .calendar-day.today .calendar-day-number { color: var(--accent); }

    /* ── Release Chips ── */
    .release-chip {
      font-size: 0.6rem;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: filter 0.12s;
    }
    .release-chip:hover { filter: brightness(1.15); }

    .release-chip.series { background: var(--green); color: #111; }
    .release-chip.anime  { background: var(--blue);  color: #111; }
    .release-chip.movie  { background: var(--red);   color: #fff; }
    .release-chip.manga  { background: var(--yellow); color: #111; }

    /* ── Footer ── */
    footer {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 1rem 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      transition: transform 0.25s ease;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,.6);
    }
    .toast.visible { transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: var(--red); color: var(--red); }

    /* ── Loading spinner ── */
    .loading {
      display: inline-block;
      width: 0.85rem; height: 0.85rem;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Legend ── */
    .legend {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 2px;
    }

    /* ── Watchlist ── */
    .watchlist-section { margin-bottom: 2.5rem; }
    .watchlist-section h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; }
    .watchlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.75rem;
    }
    .watchlist-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.15s;
    }
    .watchlist-card:hover { border-color: var(--accent-dim); }
    .watchlist-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .watchlist-card-name {
      font-weight: 600;
      font-size: 0.95rem;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .watchlist-card-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }
    .watchlist-card-actions button {
      padding: 0.2rem 0.5rem;
      font-size: 0.7rem;
      border-radius: 4px;
    }
    .btn-danger { background: var(--red); }
    .btn-danger:hover { background: #e85555; }
    .status-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      background: var(--border);
      color: var(--text-muted);
    }
    .status-badge.watching { background: var(--green); color: #111; }
    .status-badge.plan { background: var(--yellow); color: #111; }
    .status-badge.done { background: var(--blue); color: #111; }
    .status-badge.dropped { background: var(--red); color: #fff; }
    .status-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.7rem;
      padding: 0.15rem 0.3rem;
      cursor: pointer;
    }

    /* ── Mobile ── */
    @media (max-width: 700px) {
      header { padding: 1rem; }
      main { padding: 1rem 0.5rem; }
      .calendar-day { min-height: 60px; }
      .release-chip { font-size: 0.55rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">RELEASE WATCHER</div>
    <button id="checkNewBtn">↻ Check new</button>
  </header>

  <main>
    <section class="search-section">
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 Titel suchen…" autocomplete="off" />
        <select id="sourceSelect">
          <option value="tmdb">TMDB</option>
          <option value="anilist">AniList</option>
          <option value="mangadex">MangaDex</option>
          <option value="tvdb">TVDB</option>
        </select>
      </div>
      <div class="search-results" id="searchResults"></div>
    </section>

    <section class="watchlist-section">
      <h2>Watchlist</h2>
      <div class="watchlist-grid" id="watchlist"></div>
    </section>

    <section class="calendar-section">
      <div class="calendar-header">
        <h2 id="calendarMonth"></h2>
        <div class="calendar-nav">
          <button id="prevMonth">‹</button>
          <button id="nextMonth">›</button>
        </div>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Serie</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div> Anime</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div> Manga</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> Film</div>
      </div>

      <div class="calendar-grid" id="calendar"></div>
    </section>
  </main>

  <footer>
    release-watcher · <span id="titleCount">0</span> Titel · Stand <span id="lastUpdate">-</span>
  </footer>

  <div class="toast" id="toast"></div>

  <script type="module" src="./app.ts"></script>
</body>
</html>
