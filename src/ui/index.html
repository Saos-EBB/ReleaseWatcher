<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Release Watcher</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #1a1a1a;
      --bg-card: #2a2a2a;
      --text-primary: #f5f1e8;
      --text-muted: #a0a0a0;
      --accent: #d4af37;
      --accent-dark: #b8941e;
      --border: #3a3a3a;
      --success: #4ade80;
      --error: #f87171;
      --warning: #facc15;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
        sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.6;
    }

    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 1.75rem;
      font-weight: 700;
      font-family: Georgia, serif;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 1rem;
    }

    button {
      background-color: var(--accent);
      color: var(--bg-dark);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    button:hover {
      background-color: var(--accent-dark);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .search-section {
      margin-bottom: 3rem;
    }

    .search-container {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      color: var(--text-primary);
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-results {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }

    .search-results.visible {
      display: block;
    }

    .search-result-item {
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.2s;
      gap: 1rem;
    }

    .search-result-item:hover {
      background-color: var(--border);
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .result-title {
      flex: 1;
    }

    .result-type {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-right: 0.5rem;
    }

    .calendar-section {
      margin-bottom: 3rem;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .calendar-header h2 {
      font-size: 1.5rem;
    }

    .calendar-nav {
      display: flex;
      gap: 1rem;
    }

    .calendar-nav button {
      padding: 0.5rem 1.5rem;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
      background-color: var(--bg-card);
      padding: 1.5rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
    }

    .calendar-weekday {
      text-align: center;
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-muted);
      padding: 0.5rem;
      text-transform: uppercase;
    }

    .calendar-day {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.5rem;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .calendar-day.other-month {
      background-color: rgba(0, 0, 0, 0.2);
      color: var(--text-muted);
    }

    .calendar-day-number {
      font-weight: 600;
      margin-bottom: 0.25rem;
      font-size: 0.875rem;
    }

    .release-chip {
      font-size: 0.65rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      margin-bottom: 0.25rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.2s;
    }

    .release-chip:hover {
      opacity: 0.8;
    }

    .release-chip.series {
      background-color: var(--success);
      color: var(--bg-dark);
    }

    .release-chip.anime {
      background-color: var(--accent);
      color: var(--bg-dark);
    }

    .release-chip.movie {
      background-color: var(--error);
      color: var(--text-primary);
    }

    .release-chip.manga {
      background-color: var(--warning);
      color: var(--bg-dark);
    }

    footer {
      background-color: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .loading {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      main {
        padding: 1rem;
      }

      .calendar-grid {
        padding: 1rem;
      }

      .calendar-day {
        min-height: 80px;
      }

      .release-chip {
        font-size: 0.6rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">RELEASE WATCHER</div>
    <div class="header-actions">
      <button id="checkNewBtn">↻ Check new</button>
    </div>
  </header>

  <main>
    <section class="search-section">
      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Serie suchen…"
          autocomplete="off"
        />
      </div>
      <div class="search-results" id="searchResults"></div>
    </section>

    <section class="calendar-section">
      <div class="calendar-header">
        <h2 id="calendarMonth">Oktober 2026</h2>
        <div class="calendar-nav">
          <button id="prevMonth">‹ Vorher</button>
          <button id="nextMonth">Später ›</button>
        </div>
      </div>
      <div class="calendar-grid" id="calendar"></div>
    </section>
  </main>

  <footer>
    release-watcher · <span id="titleCount">0</span> Titel · Stand <span id="lastUpdate">-</span>
  </footer>

  <script type="module" src="./app.ts"></script>
</body>
</html>
